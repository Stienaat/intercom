<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Intercom</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    .app {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }


.field {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 4px 8px 4px;
  margin-bottom: 12px;

  font-size: 16px;

  border: none;
  border-bottom: 1px solid #777;

  border-radius: 0;
  outline: none;

  background: transparent;
    }

    .field:focus {
  border-bottom: 2px solid #6750A4;
}

    .button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      background: #6750A4;
        color: white;

    }

    .button:disabled {
      opacity: 0.4;
    }

    #people,
    #status {
      margin-top: 18px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Mini Intercom</h1>

    <input
      id="name"
      class="field"
      placeholder="Naam"
    />

    <input
      id="room"
      class="field"
      placeholder="Room"
    />

    <input
      id="pin"
      class="field"
      placeholder="PIN"
      type="password"
    />

    <button
      id="join"
      class="button"
    >
      Verbinden
    </button>

    <button
      id="call"
      class="button"
      disabled
    >
      Oproepen
    </button>

    <p id="people"></p>
    <p id="status">Nog niet verbonden</p>
    <div id="messageBox"></div>

<div id="incomingCallBox" style="display:none; margin-top:20px;">
      <div id="incomingCallText" style="margin-bottom:12px;"></div>

      <button id="rejectIncoming" class="button">
        Weigeren
      </button>

      <button id="acceptIncoming" class="button">
        Opnemen
      </button>
    </div>

  </div>
      <audio id="ringtone" preload="auto" loop>
      <source src="/ringtone.mp3" type="audio/mpeg">
  </audio>


<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const roomInput = document.getElementById('room');
  const joinBtn = document.getElementById('join');
  const statusEl = document.getElementById('status');
  
	const nameInput = document.getElementById('name');
	const pinInput = document.getElementById('pin');
	const peopleEl = document.getElementById('people');
	const callBtn = document.getElementById('call');

  const ringtoneEl = document.getElementById('ringtone');
  const messageBox = document.getElementById('messageBox');

  const incomingCallBox =
  document.getElementById('incomingCallBox');

  const incomingCallText =
  document.getElementById('incomingCallText');

  const rejectIncoming =
  document.getElementById('rejectIncoming');

  const acceptIncoming =
  document.getElementById('acceptIncoming');
  
	let myName = '';
	let remoteName = '';

  let pc;
  let localStream;
  let roomId;
  let callTimer = null;

  let joinedRoom = false;

  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      {
        urls: [
          'turn:openrelay.metered.ca:80',
          'turn:openrelay.metered.ca:443',
          'turn:openrelay.metered.ca:443?transport=tcp'
        ],
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  };

  async function initMedia() {
    if (localStream) return;

    // 🎤 Microfoon opvragen met ruisonderdrukking
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    // 🔊 Microfoon iets stiller zetten (vermindert ruis & blazen)
    const audioTracks = localStream.getAudioTracks();
   
  }

function startRingtone() {
  ringtoneEl.currentTime = 0;
  ringtoneEl.volume = 1;

  ringtoneEl.play().catch(err => {
    console.log('Ringtone starten mislukt:', err);
  });
}

function stopRingtone() {
  ringtoneEl.pause();
  ringtoneEl.currentTime = 0;
}

function unlockRingtone() {
  const oldVolume = ringtoneEl.volume;

  ringtoneEl.volume = 0;

  const playPromise = ringtoneEl.play();

  if (playPromise !== undefined) {
    playPromise.then(() => {
      setTimeout(() => {
        ringtoneEl.pause();
        ringtoneEl.currentTime = 0;
        ringtoneEl.volume = oldVolume;
        console.log('Ringtone vrijgegeven');
      }, 100);
    }).catch(err => {
      ringtoneEl.volume = oldVolume;
      console.log('Ringtone vrijgeven mislukt:', err);
    });
  }
}

function createPeerConnection() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.onconnectionstatechange = () => {
    console.log('connectionState:', pc.connectionState);
    statusEl.textContent = 'Status: ' + pc.connectionState;
  };

  pc.oniceconnectionstatechange = () => {
    console.log('iceConnectionState:', pc.iceConnectionState);
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit('signal', { roomId, data: { candidate: event.candidate } });
    }
  };

  pc.ontrack = (event) => {
    const [remoteStream] = event.streams;
    let audio = document.getElementById('remoteAudio');
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = 'remoteAudio';
      audio.autoplay = true;
      audio.playsInline = true;
      document.body.appendChild(audio);
    }

    audio.srcObject = remoteStream;
    audio.volume = 0.8;
    statusEl.textContent = 'Audio verbonden';
  };

  localStream.getTracks().forEach((track) => {
    pc.addTrack(track, localStream);
  });
}

  async function makeOffer() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('signal', { roomId, data: { description: pc.localDescription } });
  }

  async function handleSignal({ data }) {
    if (data.description) {
      const desc = data.description;
      if (!pc.currentRemoteDescription && desc.type === 'offer') {
        await pc.setRemoteDescription(desc);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('signal', { roomId, data: { description: pc.localDescription } });
      } else if (desc.type === 'answer') {
        await pc.setRemoteDescription(desc);
      }
    } else if (data.candidate) {
      try {
        await pc.addIceCandidate(data.candidate);
      } catch (e) {
        console.error('Error adding ICE candidate', e);
      }
    }
  }

joinBtn.onclick = async () => {

  // SLUITEN
  if (joinedRoom) {
    socket.emit('leave-room', roomId);

    resetCall();

    joinedRoom = false;
    roomId = '';

    joinBtn.textContent = 'Verbinden';
    callBtn.disabled = true;

    peopleEl.textContent = '';
    statusEl.textContent = 'Niet verbonden';

    nameInput.value = '';
roomInput.value = '';
pinInput.value = '';

messageBox.textContent = '';
incomingCallBox.style.display = 'none';
incomingCallText.textContent = '';

    return;
  }

  // VERBINDEN
  try {
    await enableSound();
  } catch (err) {
    console.error(
      'Geluid inschakelen mislukt:',
      err
    );

    statusEl.textContent =
      'Geluid kon niet worden ingeschakeld';

    return;
  }

  connectToRoom();
};

async function enableSound() {
  ringtoneEl.volume = 0;

  await ringtoneEl.play();

  await new Promise(resolve =>
    setTimeout(resolve, 250)
  );

  ringtoneEl.pause();
  ringtoneEl.currentTime = 0;
  ringtoneEl.volume = 1;

  console.log('WEB AUDIO UNLOCKED');
};

function connectToRoom() {
  roomId = roomInput.value.trim();
  const pin = pinInput.value.trim();
  myName = nameInput.value.trim();

  if (!roomId || !pin || !myName) {
    alert('Naam, room en PIN invullen');
    return;
  }

  socket.emit('join-room', {
    roomId,
    pin,
    name: myName
  });

  statusEl.textContent = 'Verbinden...';
}


socket.on('peer-ready', ({ name }) => {
  remoteName = name;

  peopleEl.textContent = 'Verbonden met: ' + remoteName;
  statusEl.textContent = remoteName + ' is online';

  callBtn.disabled = false;

  joinedRoom = true;
  joinBtn.textContent = 'Sluiten';
});

  socket.on('signal', handleSignal);
  
  let wakeLock = null;

async function keepScreenAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('Wake lock actief');
    }
  } catch (err) {
    console.log('Wake lock mislukt:', err);
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock === null) {
    await keepScreenAwake();
  }
});

function resetCall() {
  clearTimeout(callTimer);
  callTimer = null;

  stopRingtone();

  if (pc) {
    pc.close();
    pc = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
}

function offerMessage() {

  const text = prompt(
    'Geen antwoord. Korte boodschap nalaten?'
  );

  if (!text) return;

  const message = text.trim().slice(0, 100);

  if (!message) return;

  socket.emit('leave-message', {
    roomId,
    from: myName,
    message
  });

  resetCall();

  joinBtn.textContent = 'Sluiten';
  callBtn.disabled = false;

  statusEl.textContent =
    'Boodschap verstuurd';
}

callBtn.onclick = async () => {
  socket.emit('call-user', { roomId });
  statusEl.textContent = 'Oproep verstuurd...';

clearTimeout(callTimer);

callTimer = setTimeout(() => {
  socket.emit('cancel-call', { roomId });
  resetCall();
  offerMessage();
}, 25000);

  try {
    await initMedia();
    createPeerConnection();
  } catch (err) {
  console.error(
    'Media fout:',
    err.name,
    err.message
  );

  statusEl.textContent =
    'Microfoon fout: ' + err.name + ' - ' + err.message;
}
};

socket.on('incoming-call', ({ from }) => {
  remoteName = from;

  incomingCallText.textContent =
    from + ' belt je.';

  incomingCallBox.style.display = 'block';

  startRingtone();
});

rejectIncoming.onclick = () => {
  stopRingtone();

  incomingCallBox.style.display = 'none';

  const message = prompt(
    'Korte reden voor de beller?'
  );

  socket.emit('reject-call', {
    roomId,
    message: (message || '').trim().slice(0, 100)
  });

  statusEl.textContent = 'Oproep geweigerd';
};

acceptIncoming.onclick = async () => {
  stopRingtone();

  incomingCallBox.style.display = 'none';

  try {
    await initMedia();
    createPeerConnection();

    socket.emit('accept-call', { roomId });

    statusEl.textContent = 'Oproep aangenomen';
  } catch (err) {
    console.error(
      'Media fout:',
      err.name,
      err.message
    );

    statusEl.textContent =
      'Microfoon fout: ' +
      err.name +
      ' - ' +
      err.message;
  }
};

socket.on('call-accepted', async () => {
  clearTimeout(callTimer);
  callTimer = null;

  stopRingtone();

  statusEl.textContent = 'Oproep geaccepteerd';
  await makeOffer();
});

socket.on('call-rejected', ({ message } = {}) => {
  resetCall();

  callBtn.disabled = false;

  if (message) {
    statusEl.textContent =
      'Oproep geweigerd: ' + message;
  } else {
    statusEl.textContent =
      'Oproep geweigerd';
  }
});

socket.on('call-cancelled', () => {
  resetCall();

  incomingCallBox.style.display = 'none';
  incomingCallText.textContent = '';

  statusEl.textContent = remoteName
    ? remoteName + ' is online'
    : 'Verbonden';

  callBtn.disabled = false;
});

socket.on('reject-call', ({ roomId, message }) => {
  socket.to(roomId).emit('call-rejected', {
    message: String(message || '').trim().slice(0, 100)
  });
});

socket.on('room-full', () => {
  alert('Room is bezet');
});

socket.on('waiting', () => {
  statusEl.textContent = 'Wachten op contact...';
});

socket.on('join-error', (message) => {
  alert(message);
  statusEl.textContent = message;
});

socket.on('room-full', () => {
  alert('Room is bezet');
  statusEl.textContent = 'Room is bezet';
});

socket.on('message-received', ({ from, message }) => {
  messageBox.textContent = from + ': ' + message;
});

socket.on('peer-left', () => {
  resetCall();

  joinedRoom = false;
  roomId = '';

  joinBtn.textContent = 'Verbinden';
  callBtn.disabled = true;

  peopleEl.textContent = '';
  statusEl.textContent = 'Niet verbonden';

  nameInput.value = '';
  roomInput.value = '';
  pinInput.value = '';

  messageBox.textContent = '';

  incomingCallBox.style.display = 'none';
  incomingCallText.textContent = '';
});

socket.on('joined', ({ message }) => {
  statusEl.textContent = message;
});

socket.on('join-error', (message) => {
  alert(message);
  statusEl.textContent = message;
});
  
</script>

</body>
</html>
